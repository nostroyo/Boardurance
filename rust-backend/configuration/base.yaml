application:
  host: "0.0.0.0"
  base_url: "http://127.0.0.1"
database:
  host: "localhost"
  port: 27017
  database_name: "rust_backend"
  username: "rust_app"
  password: "rust_password"
  require_ssl: false
  # Repository backend: "mock" (in-memory) or "mongodb" (real persistence).
  # Left unset here so it defaults by APP_ENVIRONMENT (production -> mongodb,
  # local/test -> mock); override per-environment below or via
  # APP_DATABASE__STORAGE_BACKEND.
  storage_backend: ~