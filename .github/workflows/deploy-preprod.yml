name: Deploy (preprod)

# Deploys on every push to develop (after CI passes on the PR).
# Preprod is your manual verification checkpoint: it auto-deploys with NO
# approval gate, runs against the real OVH cluster (a separate preprod
# database), and gives you a stable URL to test before promoting to main.
#
# Order matters for sync: the backend deploys first and must report healthy
# (with the DB actually connected), then the frontend is built from the same
# commit — the frontend never ships against an older API.
on:
  push:
    branches: [develop]
  workflow_dispatch:

# Never run two preprod deploys at once; a newer push supersedes a queued one.
concurrency:
  group: deploy-preprod
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'rust-backend/**'
              - '.github/workflows/deploy-preprod.yml'
            frontend:
              - 'empty-project/**'
              - '.github/workflows/deploy-preprod.yml'

  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # The `preprod` GitHub Environment has NO required reviewers — preprod is
    # meant to deploy automatically. Its secrets/vars (preprod Render hook,
    # preprod BACKEND_URL) are scoped to this environment so the preprod job
    # physically cannot read prod's deploy hook.
    environment: preprod
    steps:
      - name: Trigger Render deploy (preprod)
        run: curl -fsS -X POST "${{ secrets.RENDER_PREPROD_DEPLOY_HOOK_URL }}"

      - name: Wait for backend to be healthy
        # Render builds the Docker image then rolls out; the first (uncached)
        # Rust build can take a while, so poll generously (up to ~20 min).
        #
        # /health_check returns HTTP 200 even when Mongo is unreachable (it
        # reports {"status":"degraded"} — see rust-backend/src/routes/health_check.rs).
        # So we require status:"ok", which only happens once the DB is connected;
        # otherwise a deploy with a broken DB connection would look "healthy".
        run: |
          set -e
          URL="${{ vars.BACKEND_URL }}/health_check"
          for i in $(seq 1 80); do
            if curl -fsS "$URL" 2>/dev/null | grep -q '"status":"ok"'; then
              echo "✅ Preprod backend healthy (DB connected) after $((i*15))s"
              exit 0
            fi
            echo "Attempt $i/80: backend not ready (or DB not connected), waiting 15s..."
            sleep 15
          done
          echo "❌ Preprod backend did not report status:ok in time"
          exit 1

  deploy-frontend:
    needs: [changes, deploy-backend]
    # Runs when the frontend changed, but only after a successful (or skipped)
    # backend deploy — never against a failed one.
    if: >-
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      needs.deploy-backend.result != 'failure' &&
      needs.deploy-backend.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      # The preprod frontend is a Render Static Site (boardurance-web-preprod),
      # built from `develop` with the preprod VITE_API_BASE_URL set in its
      # dashboard. Trigger it after the preprod backend is healthy.
      - name: Trigger Render static-site deploy (preprod)
        run: curl -fsS -X POST "${{ secrets.RENDER_PREPROD_WEB_DEPLOY_HOOK_URL }}"

      - name: Wait for frontend to be live
        # Static builds are quick (~1-2 min). Poll the public URL until it serves.
        run: |
          set -e
          URL="${{ vars.FRONTEND_URL }}"
          for i in $(seq 1 40); do
            if curl -fsS "$URL" >/dev/null 2>&1; then
              echo "✅ Preprod frontend live after $((i*15))s"
              exit 0
            fi
            echo "Attempt $i/40: frontend not ready, waiting 15s..."
            sleep 15
          done
          echo "❌ Preprod frontend did not come up in time"
          exit 1
