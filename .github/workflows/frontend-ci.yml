name: Frontend CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'empty-project/**'
      - 'docs/openapi.json'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'empty-project/**'
      - 'docs/openapi.json'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    # The toolchain (vitest 4, vite 7) hard-requires Node >=20; on an
    # unsupported Node the vitest fork pool can hang forever instead of
    # failing. Without a timeout GitHub lets a hung job run for 6 hours.
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./empty-project

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: empty-project/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Check API types match the OpenAPI contract
      # Regenerate src/types/api-generated.ts from docs/openapi.json and fail if
      # it differs from the committed file — i.e. the backend contract changed
      # but the frontend types weren't regenerated (run `npm run gen:api`).
      run: npm run gen:api:check

    - name: Run TypeScript compilation check
      run: npx tsc --noEmit

    - name: Run ESLint
      run: npm run lint -- --max-warnings 1000
      continue-on-error: true

    - name: Run Prettier check
      run: npm run format:check
      continue-on-error: true

    - name: Run unit tests
      run: npm run test -- --run

    - name: Build application
      run: npm run build

    - name: Run security audit
      run: npm audit --audit-level=high
      continue-on-error: true